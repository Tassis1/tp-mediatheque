<VirtualHost *:80>
    ServerName mediatheque.local

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>


<VirtualHost *:443>
    ServerName mediatheque.local

    DocumentRoot /usr/local/apache2/htdocs

    <Directory /usr/local/apache2/htdocs>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>


    # SSL
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/ssl/mediatheque.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/ssl/mediatheque.key


    # Headers de sécurité
    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"


    # API → WildFly
    ProxyPreserveHost On
    ProxyPass /api http://host.docker.internal:8080/mediatheque-api/api
    ProxyPassReverse /api http://host.docker.internal:8080/mediatheque-api/api


    ErrorLog /usr/local/apache2/logs/mediatheque_error.log
    CustomLog /usr/local/apache2/logs/mediatheque_access.log combined

</VirtualHost>